name: Build and Test

on:
  push:
    branches:
      - main
      - JOB-14

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Show repository files
        run: |
          pwd
          find . -maxdepth 4 -name build.xml -print
          find . -maxdepth 3 -type d -print

      - name: Build project
        run: ant -noinput -f JobProtalWebsite/build.xml clean jar

      - name: Run JUnit tests
        run: ant -noinput -f JobProtalWebsite/build.xml test
