name: Build and Test

on:
  push:
    branches:
      - main
      - JOB-14

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"

      - name: Build project
        run: ant -noinput clean jar

      - name: Run JUnit tests
        run: ant -noinput test
