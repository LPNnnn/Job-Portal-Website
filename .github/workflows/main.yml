name: Build and Test

on:
  push:
    branches:
      - main
      - JOB-14

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Show Java version
        run: java -version

      - name: Build project
        run: ant -noinput -f build.xml clean jar

      - name: Download JUnit 4 libraries
        run: |
          mkdir -p ci-lib

          curl -L \
            -o ci-lib/junit-4.13.2.jar \
            https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar

          curl -L \
            -o ci-lib/hamcrest-core-1.3.jar \
            https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Run JUnit tests
        run: |
          ant -noinput \
            -Dlibs.junit.classpath="$GITHUB_WORKSPACE/ci-lib/junit-4.13.2.jar:$GITHUB_WORKSPACE/ci-lib/hamcrest-core-1.3.jar" \
            -Dlibs.junit_4.classpath="$GITHUB_WORKSPACE/ci-lib/junit-4.13.2.jar:$GITHUB_WORKSPACE/ci-lib/hamcrest-core-1.3.jar" \
            -Dlibs.junit_5.classpath="$GITHUB_WORKSPACE/ci-lib/junit-4.13.2.jar:$GITHUB_WORKSPACE/ci-lib/hamcrest-core-1.3.jar" \
            -f build.xml test
