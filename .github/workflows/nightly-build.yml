name: Nightly Java Build

on:
  # Run every night at 2:00 AM Malaysia time.
  # GitHub schedules use UTC.
  schedule:
    - cron: "0 18 * * *"

  # Allows manual testing from the GitHub Actions page.
  workflow_dispatch:

  # Run when the integrated branch is updated.
  push:
    branches:
      - JOB13
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile Java Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create build directory
        run: mkdir -p bin

      - name: Compile Java source files
        run: |
          find src -name "*.java" -print0 | xargs -0 javac -d bin

      - name: Confirm successful build
        run: |
          echo "Nightly Java build completed successfully."
          echo "JOB-03, JOB-08 and JOB-13 compiled successfully."